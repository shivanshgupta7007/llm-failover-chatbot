services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      LITELLM_CACHE_DIR: /data/litellm-cache
    volumes:
      - app-data:/data
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  app-data:
